name: opportunity-radar

services:
  radar:
    build:
      context: ..
      dockerfile: apps/radar/Dockerfile
    image: opportunity-radar-console:local
    environment:
      NODE_ENV: production
      RADAR_DATA_DIR: /data
      RADAR_WRITE_TOKEN: ${RADAR_WRITE_TOKEN:?set RADAR_WRITE_TOKEN in deploy/.env}
    ports:
      - "127.0.0.1:${RADAR_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${RADAR_DATA_PATH:?set RADAR_DATA_PATH in deploy/.env}
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
